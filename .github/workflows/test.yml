name: Test

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Agent Zero ${{ matrix.a0_ref }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        a0_ref:
          - 6a6cecff8527b164668c7a6ab2f76b6b1ed7cfa1
          - main
    steps:
      - name: Check out SAM Mesh Embassy
        uses: actions/checkout@v4

      - name: Check out Agent Zero
        uses: actions/checkout@v4
        with:
          repository: agent0ai/agent-zero
          ref: ${{ matrix.a0_ref }}
          path: agent-zero

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: >-
          python -m pip install -r requirements.txt
          -r agent-zero/requirements.txt -r agent-zero/requirements.dev.txt

      - name: Run unit tests
        env:
          A0_CHECKOUT: ${{ github.workspace }}/agent-zero
        run: python -m pytest -m "not integration" -v
