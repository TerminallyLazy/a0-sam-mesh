name: Verify SAM Mesh

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install lint tooling
        run: python -m pip install ruff==0.16.0
      - name: Fetch the pinned native Alpine runtime for UI regression
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/agent0ai/agent-zero/b1cbd1f960a1a5c4482b324dcff4742aa67b7a51/webui/vendor/alpine/alpine.min.js -o "$RUNNER_TEMP/alpine.min.js"
          curl --fail --location --retry 3 https://raw.githubusercontent.com/agent0ai/agent-zero/b1cbd1f960a1a5c4482b324dcff4742aa67b7a51/webui/js/AlpineStore.js -o "$RUNNER_TEMP/AlpineStore.js"
      - name: Lint, UI behavior, and secret patterns
        run: |
          ruff check .
          ruff format --check .
          node --check webui/observatory-store.js
          node --check webui/settings-store.js
          SAM_TEST_ALPINE_JS="$RUNNER_TEMP/alpine.min.js" SAM_TEST_ALPINE_STORE_JS="$RUNNER_TEMP/AlpineStore.js" node --test tests/*.mjs
          python scripts/scan-secrets.py

  framework:
    name: Native Agent Zero (${{ matrix.a0_ref }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        a0_ref:
          - b1cbd1f960a1a5c4482b324dcff4742aa67b7a51
          - main
    env:
      A0_IMAGE: agent0ai/agent-zero@sha256:db4617788520154de9173c59b581f4f0c6ef7a6c75c01d4c2fbc689793896b10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable framework and exact commit archive
        env:
          A0_REF: ${{ matrix.a0_ref }}
        run: |
          curl --fail --location --retry 3 "https://codeload.github.com/agent0ai/agent-zero/tar.gz/$A0_REF" -o "$RUNNER_TEMP/a0.tar.gz"
          git archive --format=zip --output="$RUNNER_TEMP/sam-mesh.zip" HEAD
          docker run --detach --name sam-ci \
            --volume "$GITHUB_WORKSPACE:/candidate:ro" \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            --env LITELLM_LOCAL_MODEL_COST_MAP=True \
            --entrypoint /bin/sleep "$A0_IMAGE" infinity
          docker cp "$RUNNER_TEMP/a0.tar.gz" sam-ci:/tmp/a0.tar.gz
          docker cp "$RUNNER_TEMP/sam-mesh.zip" sam-ci:/tmp/sam-mesh.zip
          docker cp scripts/verify-community.py sam-ci:/tmp/verify-community.py
          docker exec sam-ci sh -c 'mkdir -p /a0; tar -xzf /tmp/a0.tar.gz --strip-components=1 -C /a0; mkdir -p /a0/usr/plugins; chmod 755 /a0/usr /a0/usr/plugins; touch /a0/.sam-community-verification'
          docker exec sam-ci /opt/venv-a0/bin/python -m pip install --target /tmp/test-tools pytest==8.4.2 packaging==24.2
          docker network disconnect bridge sam-ci
      - name: Complete Python suite in the framework runtime
        run: |
          docker exec --workdir /candidate --env A0_CHECKOUT=/a0 --env PYTHONPATH=/tmp/test-tools \
            sam-ci /opt/venv-a0/bin/python -m pytest -q -p no:cacheprovider
      - name: Native install, scopes, auth, hooks, and uninstall
        run: |
          docker exec --workdir /a0 --env PYTHONPATH=/a0 \
            sam-ci /opt/venv-a0/bin/python /tmp/verify-community.py /tmp/sam-mesh.zip \
            --report /tmp/native-community-verification.json
          docker cp sam-ci:/tmp/native-community-verification.json "$RUNNER_TEMP/native-community-verification.json"
      - uses: actions/upload-artifact@v4
        with:
          name: native-verification-${{ matrix.a0_ref }}
          path: ${{ runner.temp }}/native-community-verification.json
          if-no-files-found: error
      - name: Remove disposable runtime
        if: always()
        run: docker rm --force sam-ci || true

  sovereign:
    name: Sovereign Linux network certification
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      A0_IMAGE: agent0ai/agent-zero@sha256:db4617788520154de9173c59b581f4f0c6ef7a6c75c01d4c2fbc689793896b10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified published SAM and pinned Agent Zero source
        run: |
          mkdir -p "$RUNNER_TEMP/sam-bin"
          curl --fail --location --retry 3 https://github.com/google/sam/releases/download/v0.1.0-alpha.9/sam_Linux_arm64.tar.gz -o "$RUNNER_TEMP/sam.tar.gz"
          echo "cf0d2ae56674ba5a4f57165285b230da602a637dc698109145a8a0a0f688b02d  $RUNNER_TEMP/sam.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/sam.tar.gz" -C "$RUNNER_TEMP/sam-bin"
          curl --fail --location --retry 3 https://codeload.github.com/agent0ai/agent-zero/tar.gz/b1cbd1f960a1a5c4482b324dcff4742aa67b7a51 -o "$RUNNER_TEMP/a0.tar.gz"
      - name: Build isolated UI firewall initializer
        run: docker build -t sovereign-ui-network -f deploy/ui/Dockerfile .
      - name: Certify actual TUN, denied egress, credentials, native UI, and rollback
        run: |
          UI_IMAGE=$(docker image inspect sovereign-ui-network --format '{{.Id}}')
          python3 deploy/scripts/certify-runtime.py \
            --binary-dir "$RUNNER_TEMP/sam-bin" --image "$A0_IMAGE" \
            --firewall-image "$UI_IMAGE" --a0-source-tar "$RUNNER_TEMP/a0.tar.gz" \
            --output "$RUNNER_TEMP/sovereign-certification.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sovereign-linux-certification
          path: ${{ runner.temp }}/sovereign-certification.json
          if-no-files-found: error
