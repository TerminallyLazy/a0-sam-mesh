<html>
<head>
  <meta charset="utf-8">
  <title>Mesh Observatory</title>
  <script type="module" src="/plugins/sam_mesh/webui/observatory-store.js"></script>
  <link rel="stylesheet" href="/plugins/sam_mesh/webui/observatory.css">
</head>
<body>
<div x-data class="sam-observatory-host">
<template x-if="$store.samObservatory">
<section class="sam-observatory" x-data="{ get s() { return $store.samObservatory; } }" x-init="s.onOpen()" x-destroy="s.cleanup()" x-effect="$store.chats?.selected; $store.tasks?.selected; s.scopeChanged()">
  <header class="sam-header">
    <div class="sam-brand"><img src="/plugins/sam_mesh/webui/thumbnail.webp" width="32" height="32" alt=""><div><h2>SAM Mesh</h2><span class="sam-subtitle" x-text="s.node.scope ? [s.node.scope.project_name || 'Global', s.node.scope.agent_profile || 'Default'].join(' / ') : 'Mesh Observatory'"></span></div></div>
    <div class="sam-actions"><button type="button" class="button sam-icon-button" @click="s.openSettings()" aria-label="SAM Mesh connection settings"><x-icon name="settings"></x-icon></button><button type="button" class="button sam-icon-button" @click="s.refresh()" :disabled="s.loading" aria-label="Refresh Observatory"><x-icon name="refresh"></x-icon></button></div>
  </header>
  <nav class="sam-tabs" role="tablist" aria-label="Observatory views">
    <button type="button" role="tab" :aria-selected="s.view === 'Node'" @click="s.select('Node')">Node</button>
    <button type="button" role="tab" :aria-selected="s.view === 'Catalog'" @click="s.select('Catalog')">Catalog</button>
    <button type="button" role="tab" :aria-selected="s.view === 'Routes'" @click="s.select('Routes')">Routes</button>
    <button type="button" role="tab" :aria-selected="s.view === 'Activity'" @click="s.select('Activity')">Activity</button>
    <button type="button" role="tab" :aria-selected="s.view === 'Embassy'" @click="s.select('Embassy')">Embassy</button>
  </nav>
  <p class="sam-refresh-status" x-show="s.loading" role="status" x-text="s.view === 'Catalog' ? 'Discovering services…' : 'Checking connection…'"></p>
  <div x-show="s.node.stopped" class="sam-notice" role="status">Disconnected. New outbound dispatch is blocked for this project and profile. Previously admitted calls may finish.</div>
  <section x-show="s.view === 'Node'" aria-label="Node status">
    <div class="sam-connection" :class="{ 'sam-connected': s.node.ready }">
      <div class="sam-connection-heading"><span class="sam-status-dot" :class="{ 'is-ready': s.node.ready, 'is-working': s.loading || ['installing', 'starting'].includes(s.node.setup?.status) }"></span><h3 x-text="s.connectionTitle"></h3></div>
      <p x-text="s.connectionDetail"></p>
      <button type="button" class="button" x-show="!s.node.ready && !['installing', 'starting'].includes(s.node.setup?.status)" @click="s.openSettings()">Connection settings</button>
    </div>
    <dl class="sam-facts"><dt>Connection</dt><dd x-text="s.node.connection === 'managed' ? 'Managed local mesh' : 'Existing SAM node'"></dd>
      <dt>Endpoint</dt><dd><code x-text="s.node.endpoint || 'Automatic setup'"></code></dd>
      <dt>Mode</dt><dd x-text="({explorer: 'Explorer', guarded_mesh: 'Guarded Mesh', embassy: 'Embassy', sovereign: 'Sovereign'})[s.node.mode] || 'Explorer'"></dd>
      <dt>Remote calls</dt><dd x-text="s.node.features?.remote_calls ? 'Approval required' : 'Disabled'"></dd></dl>
    <details class="sam-diagnostics"><summary>Connection details</summary>
      <p class="sam-note" x-text="s.fact(s.node.status)"></p>
      <p class="sam-note" x-show="s.node.connection_issue" x-text="(s.node.connection_issue || '').replaceAll('_', ' ')"></p>
      <button type="button" class="button" @click="s.planNative()" :disabled="s.loading || !s.node.ready">Inspect native MCP compatibility</button>
      <pre class="sam-code" x-show="s.nativePlan" x-text="s.json(s.nativePlan)"></pre>
    </details>
    <div x-show="s.node.stopped"><p>Resume applies the current passport and requires fresh approvals.</p>
      <label>Type RESUME<input x-model="s.resumeAck" autocomplete="off"></label>
      <button type="button" class="button" @click="s.resume()" :disabled="s.loading || s.resumeAck !== 'RESUME'">Resume this scope</button>
    </div>
    <p class="sam-note">Explorer lets the agent discover services. Enable remote calls in settings when you are ready; approvals stay scoped to this chat.</p>
  </section>
  <section x-show="s.view === 'Catalog'" aria-label="Discovered catalog">
    <div class="sam-section-head"><h3>Services</h3><span class="sam-chip" x-text="s.fact(s.catalog?.status)"></span></div>
    <p class="sam-note">Choose a service discovered on your mesh. Refresh to check for new services.</p>
    <label>Service type<select x-model="s.kind" @change="s.changeCatalogKind()"><option value="mcp">MCP tools</option><option value="inference">Inference providers</option></select></label>
    <label>Discovered service<select x-model="s.selectedService" :disabled="s.loading || !s.serviceChoices.length">
      <option value="" x-text="s.serviceChoices.length ? 'All discovered services' : (s.loading ? 'Discovering services…' : (s.catalog ? 'No services available yet' : 'Services unavailable'))"></option>
      <template x-for="name in s.serviceChoices" :key="name"><option :value="name" x-text="name"></option></template>
    </select></label>
    <label x-show="s.discoveredEntries.length">Filter results<input type="search" x-model="s.query" placeholder="Search names, descriptions or peers" autocomplete="off"></label>
    <div class="sam-section-head" x-show="s.discoveredEntries.length">
      <span class="sam-note" role="status" x-text="s.catalogEntries.length + ' of ' + s.discoveredEntries.length + ' discovered providers'"></span>
      <button type="button" class="button" x-show="s.query || s.selectedService" @click="s.clearCatalogFilters()">Clear filters</button>
    </div>
    <div class="sam-empty" x-show="s.catalog && !s.discoveredEntries.length">
      <h4 x-text="s.kind === 'mcp' ? 'No MCP services advertised yet' : 'No inference providers advertised yet'"></h4>
      <p>Your node has no visible services of this type. Connect to a mesh with advertised services, or publish a service to make it available here.</p>
      <button type="button" class="button" @click="s.openSettings()">Connection settings</button>
    </div>
    <div class="sam-empty" x-show="s.discoveredEntries.length && !s.catalogEntries.length">
      <h4>No matching services</h4><p>Clear the filters to see the discovered services.</p>
    </div>
    <div class="sam-error" x-show="s.catalogError" role="alert"><strong>Could not load services</strong><p x-text="s.catalogError"></p><button type="button" class="button" @click="s.refresh()" :disabled="s.loading">Try again</button></div>
    <p class="sam-note" x-show="!s.contextId">Open a chat to discover services for its project and profile.</p>
    <div class="sam-catalog"><template x-for="(entry, index) in s.catalogEntries" :key="index"><article class="sam-card">
      <h4 x-text="entry.srv_name || 'Unnamed service'"></h4>
      <p x-show="entry.srv_description" x-text="entry.srv_description"></p>
      <dl class="sam-facts"><dt>Peer</dt><dd><code x-text="entry.peer_id || 'Unavailable'"></code></dd></dl>
      <details><summary>Service details</summary><pre class="sam-code" x-text="s.json(entry)"></pre></details>
    </article></template></div>
    <p class="sam-note" x-show="s.catalogEntries.length">Showing up to 50 service advertisements visible to your node. A service may have several peers. Review the destination before approving a call.</p>
  </section>
  <section x-show="s.view === 'Routes'" aria-label="Routes and preflight">
    <h3>Destination and data</h3><p>Automatic inference may fail over between eligible providers. Named routes disclose one peer and service. Required labels use any-of matching.</p>
    <details><summary>Mesh inference</summary>
      <p>Use SAM Mesh in Agent Zero’s model settings for ordinary chat. These controls review routing and run explicit diagnostics.</p>
      <label>Model<input x-model="s.model" autocomplete="off"></label>
      <div class="sam-actions sam-wrap"><button type="button" class="button" @click="s.profile()" :disabled="s.loading || !s.model">Review provider settings</button>
        <button type="button" class="button" @click="s.probe(false)" :disabled="s.loading || !s.model || s.node.stopped">Send public probe</button>
        <button type="button" class="button" @click="s.probe(true)" :disabled="s.loading || !s.model || s.node.stopped">Send streaming probe</button></div>
      <p class="sam-note">Probes send only “Reply with probe-ok.” to the configured mesh. They do not certify model compatibility.</p>
      <pre class="sam-code" x-show="s.inference" x-text="s.json(s.inference)"></pre>
      <h4>Prepare a named inference request</h4>
      <label>Peer ID<input x-model="s.peer" autocomplete="off"></label>
      <label>Discovered inference service<input x-model="s.service" autocomplete="off"></label>
      <label>Data class<select x-model="s.dataClass"><option>public</option><option>internal</option><option>confidential</option><option>regulated</option></select></label>
      <label>Message<textarea rows="4" x-model="s.message" spellcheck="false"></textarea></label>
      <p class="sam-note">The current catalog must identify this exact peer and service. Preflight stores the payload encrypted for five minutes; approval is separate.</p>
      <button type="button" class="button" @click="s.prepareInference()" :disabled="s.loading || s.node.stopped">Review named request</button>
    </details>
    <details><summary>Prepare a remote tool call</summary>
      <div class="sam-form"><label>Peer ID<input x-model="s.peer" autocomplete="off"></label>
        <label>Canonical tool URI<input x-model="s.tool" placeholder="mcp://service/tool" autocomplete="off"></label>
        <label>Data class<select x-model="s.dataClass"><option>public</option><option>internal</option><option>confidential</option><option>regulated</option></select></label>
        <label>Arguments (JSON)<textarea rows="5" x-model="s.payload" spellcheck="false"></textarea></label>
        <p class="sam-note">Use this protected form for sensitive payloads. Node credentials are never accepted. The chat receives only a decision ID.</p>
        <button type="button" class="button" @click="s.preflight()" :disabled="s.loading || s.node.stopped">Preflight</button>
      </div>
    </details>
    <h3>Review an existing decision</h3><label>Decision ID<input x-model="s.decisionId" autocomplete="off"></label>
    <button type="button" class="button" @click="s.inspect()" :disabled="s.loading">Inspect decision</button>
    <template x-if="s.review"><div class="sam-review">
      <span class="sam-chip" x-text="s.review.approved ? 'Approved · single use' : s.review.outcome"></span>
      <dl class="sam-facts"><dt>Recipient</dt><dd x-text="s.review.peer_id"></dd><dt>Capability</dt><dd x-text="s.review.tool_name"></dd>
        <dt>Risk / data</dt><dd x-text="s.review.risk_level + ' / ' + s.review.data_class"></dd>
        <dt>Payload fingerprint</dt><dd><code x-text="s.review.argument_hash"></code></dd></dl>
      <p x-show="s.review.kind !== 'inference'">SAM may retry an ambiguous remote failure. A mutation could execute more than once. This approval expires and authorizes one plugin invocation.</p>
      <label x-show="s.review.outcome === 'needs_approval' && !s.review.approved">Type APPROVE<input x-model="s.acknowledgment" autocomplete="off"></label>
      <div class="sam-actions"><button type="button" class="button" @click="s.approve()" :disabled="s.loading || s.review.approved || s.review.outcome !== 'needs_approval' || s.acknowledgment !== 'APPROVE'">Approve once</button>
        <button type="button" class="button" x-show="s.review.kind === 'inference' && s.review.approved" @click="s.invokeInference()" :disabled="s.loading || s.node.stopped">Send approved request</button>
        <button type="button" class="button" @click="s.revoke()" :disabled="s.loading">Revoke decision</button></div>
      <p>Decision ID: <code x-text="s.review.decision_id"></code></p>
    </div></template>
    <pre class="sam-code" x-show="s.inferenceResult" x-text="s.json(s.inferenceResult)"></pre>
  </section>
  <section x-show="s.view === 'Activity'" aria-label="Audit activity">
    <div class="sam-section-head"><h3>Recent activity</h3><button type="button" class="button" @click="s.exportAudit()" :disabled="s.loading">Export redacted audit</button></div>
    <p x-show="!s.events.length">No recorded activity for this chat.</p>
    <ol class="sam-events"><template x-for="event in s.events" :key="event.sequence"><li><div><strong x-text="event.outcome"></strong><span class="sam-chip" x-text="event.risk_level"></span></div><p x-text="event.timestamp"></p><code x-text="event.error_code || event.destination_alias || 'Local control'"></code></li></template></ol>
  </section>
  <section x-show="s.view === 'Embassy'" aria-label="Embassy publication">
    <div class="sam-section-head"><h3>Bounded services</h3><span class="sam-chip" x-text="s.embassyRuntime?.deployment?.available ? 'Authenticated gateway configured' : 'Gateway setup required'"></span></div>
    <p>Each service runs within this project and profile. Allow its name in saved Embassy settings, review its declaration, then start the broker.</p>
    <template x-for="entry in (s.embassyRuntime?.services || [])" :key="entry.name"><div class="sam-card">
      <strong x-text="entry.name"></strong><span class="sam-chip" x-text="entry.state.replaceAll('_', ' ')"></span>
      <p><span x-text="entry.active_sessions"></span> active sessions</p>
      <button type="button" class="button" @click="s.closePublication(entry.name)" :disabled="s.loading">Close and drain</button>
    </div></template>
    <details><summary>Review a service declaration</summary>
      <label>Service name<input x-model="s.embassyName" placeholder="research-desk"></label>
      <label>Local project<input x-model="s.embassyProject"></label>
      <label>Agent profile<input x-model="s.embassyProfile"></label>
      <button type="button" class="button" @click="s.planPublication()" :disabled="s.loading">Validate declaration</button>
      <pre class="sam-code" x-show="s.publication" x-text="s.json(s.publication)"></pre>
      <div x-show="s.publication?.service && s.embassyRuntime?.deployment?.available">
        <label><input type="checkbox" x-model="s.publicationAck"> I approve this service and its displayed limits.</label>
        <button type="button" class="button" @click="s.startPublication()" :disabled="s.loading || !s.publicationAck">Start reviewed service</button>
      </div>
    </details>
    <p class="sam-note">Apply the generated declaration to the isolated SAM node to advertise it. Closing the broker rejects new calls immediately; remove the node declaration to finish withdrawal.</p>
    <pre class="sam-code" x-show="s.deployment" x-text="s.json(s.deployment)"></pre>
    <p class="sam-note">The optional Sovereign deployment has a separate capability gate. Plugin settings alone do not enforce all network traffic.</p>
  </section>
  <footer class="sam-stop"><button type="button" class="button sam-danger" @click="s.stopConfirm = true">Emergency disconnect</button>
    <div x-show="s.stopConfirm" role="alert"><p>Block new calls and revoke approvals for this project and profile?</p>
      <button type="button" class="button sam-danger" @click="s.disconnect()">Disconnect now</button>
      <button type="button" class="button" @click="s.stopConfirm = false">Cancel</button></div>
  </footer>
</section>
</template>
</div>
</body>
</html>
